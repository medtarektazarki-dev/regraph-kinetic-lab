name: Feature request
description: Suggest a workflow or guidance improvement
title: "feature: "
labels: [enhancement]
body:
  - type: textarea
    id: use-case
    attributes:
      label: What are you trying to make?
      description: Describe the video task and who it is for.
    validations:
      required: true
  - type: textarea
    id: gap
    attributes:
      label: What is missing today?
      description: Tell us where the current workflow falls short.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent or production stack
      placeholder: Antigravity + Remotion, Claude Code + After Effects, etc.
    validations:
      required: false
