name: Bug report
description: Report an install, activation, or workflow problem
title: "bug: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Please remove private project details, customer assets, credentials, and personal data before posting.
  - type: input
    id: agent
    attributes:
      label: Agent and version
      placeholder: Antigravity, Claude Code, Codex, etc.
    validations:
      required: true
  - type: input
    id: install
    attributes:
      label: Install command or method
      placeholder: npx skills add ...
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Include the shortest steps that reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
